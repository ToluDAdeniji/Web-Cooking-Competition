<!DOCTYPE html>
<html lang="en">

	<meta name="description" content="Cooking Competition show">
	<title>Home - Cooking Competition</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body class="body">
    <!--Navigation Bar-->
    <nav>
        <div id="nav-title">Game Title</div>
        <div class="nav-buttons">
            <!--Home Button-->
            <a href="index.html" class="nav-link">
                <div class="nav-button">Home</div>
            </a>   
            <!--About Me Button-->
            <a href="about.html" class="nav-link">
                <div class="nav-button">About</div>
            </a>      
        </div>
    </nav>
    
<!--Main Content-->
	<main>
        <div class="content-grid">
            <!-- Hidden checkbox -->
            <input type="checkbox" id="start-enable">

            <!-- Start button is now outside the content-box, so it won't get blurred -->
            <label for="start-enable" id="start-link">
                <div class="start-button">Start</div>
            </label>

            <div class="content-box">
                <!--Narrative Text Box-->
                <div id="narrative">
                    This is the narrative text for the cooking competition!
                </div>
            </div>
        </div>
	</main>
